<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CinePro TV - Modo Smart TV Leve</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
html,body{width:100%;height:100%;background:#000;color:#fff;overflow:hidden;}
#tvVideo{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain;z-index:1;}
#painelTv{position:fixed;top:0;left:0;bottom:0;width:400px;background:#141414;border-right:2px solid #e50914;z-index:10;display:flex;flex-direction:column;}
#painelTv.oculto{display:none;}
.topo-tv{padding:12px 14px;background:#0b0b0b;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;}
.marca-tv{font-size:18px;font-weight:bold;color:#fff;letter-spacing:0.5px;}
.marca-tv span{color:#e50914;}
.selo-tv{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:4px;background:#222;color:#4ade80;border:1px solid #333;}
.cats-tv{display:flex;overflow-x:auto;background:#1a1a1a;border-bottom:1px solid #2a2a2a;padding:6px 8px;gap:6px;flex-shrink:0;}
.cat-btn{padding:6px 10px;font-size:12px;font-weight:bold;border:1px solid #333;background:#222;color:#ccc;border-radius:4px;white-space:nowrap;cursor:pointer;}
.cat-btn.ativa{background:#e50914;border-color:#ff3b45;color:#fff;}
#listaTv{flex:1;overflow-y:auto;padding:8px;}
.item-tv{display:flex;align-items:center;gap:10px;padding:10px 10px;margin-bottom:4px;background:#1c1c1c;border:2px solid transparent;border-radius:6px;cursor:pointer;}
.item-tv.foco{background:#2a1215;border-color:#e50914;color:#fff;}
.item-tv.ativo .num-tv{color:#4ade80;}
.num-tv{font-size:14px;font-weight:bold;color:#e50914;min-width:44px;font-family:monospace;}
.nome-tv{font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.tag-vip{font-size:10px;background:#f59e0b;color:#000;font-weight:bold;padding:2px 5px;border-radius:3px;}
.rodape-tv{padding:8px 12px;background:#0b0b0b;border-top:1px solid #2a2a2a;font-size:11px;color:#ccc;line-height:1.45;}
.rodape-cod{color:#6ee7b7;font-weight:bold;margin-top:3px;}
#osdCanal{position:fixed;right:24px;bottom:24px;background:#141414;border:2px solid #e50914;border-radius:8px;padding:10px 16px;z-index:12;min-width:250px;display:none;}
#osdCanal.visivel{display:block;}
#osdCanalNum{font-size:13px;font-weight:bold;color:#e50914;}
#osdCanalNome{font-size:18px;font-weight:bold;color:#fff;margin-top:2px;}
#osdNumero{position:fixed;top:24px;right:24px;background:#141414;border:2px solid #e50914;color:#fff;font-size:32px;font-weight:bold;padding:10px 20px;border-radius:8px;z-index:20;display:none;font-family:monospace;}
#btnAbrirMenu{position:fixed;top:16px;left:16px;z-index:8;background:#141414;color:#fff;border:1px solid #e50914;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;display:none;}
#btnAbrirMenu.visivel{display:block;}
#avisoSom{position:fixed;top:20px;left:50%;margin-left:-145px;width:290px;text-align:center;background:#e50914;color:#fff;padding:10px 14px;border-radius:20px;font-size:13px;font-weight:bold;z-index:25;cursor:pointer;display:none;}
</style>
</head>
<body>
<video id="tvVideo" autoplay playsinline></video>
<button id="btnAbrirMenu" type="button" onclick="mostrarPainel(true)">☰ Canais (OK)</button>
<div id="avisoSom" onclick="ativarSomTv()">🔊 Clique ou aperte OK para ativar o som</div>
<div id="osdNumero">CH ---</div>
<div id="osdCanal">
  <div id="osdCanalNum">#001</div>
  <div id="osdCanalNome">Carregando...</div>
</div>
<div id="painelTv">
  <div class="topo-tv">
    <div class="marca-tv">CINE<span>PRO</span> TV</div>
    <div class="selo-tv" id="seloTvStatus">Modo Samsung Leve</div>
  </div>
  <div class="cats-tv" id="barraCats"></div>
  <div id="listaTv"></div>
  <div class="rodape-tv">
    <div>▲▼ Canais • ◄► Categorias • OK Tela Cheia • 0-9 Número</div>
    <div class="rodape-cod" id="rodapeCodControle">Controle no celular (/controle): Cód. ------</div>
  </div>
</div>
<script>
(function () {
  var CLOUDFLARE_PROXY = 'https://cinepro-tv-proxy.jonasskynet.workers.dev/?url=';
  var CATS = [
    { id: 'all', nome: 'Todos' },
    { id: 'vip', nome: 'VIP' },
    { id: 'aberta', nome: 'TV Aberta' },
    { id: 'esportes', nome: 'Esportes' },
    { id: 'filmes', nome: 'Filmes' },
    { id: 'series', nome: 'Séries' },
    { id: 'comedia', nome: 'Comédia' },
    { id: 'shows', nome: 'Shows' },
    { id: 'musica', nome: 'Rádios' }
  ];

  var todos = [];
  var filtrados = [];
  var catIdx = 0;
  var focoIdx = 0;
  var atualId = null;
  var anteriorIdx = -1;
  var painelAberto = true;
  var ehLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
  var hlsInst = null;
  var bufferDigitos = '';
  var timerDigitos = null;
  var timerOsd = null;
  var codigoTv = '';

  try { codigoTv = (sessionStorage.getItem('cinepro_tv_code') || '').replace(/[^A-Z0-9_-]/g, ''); } catch (e) {}
  if (!codigoTv) {
    codigoTv = String(Math.floor(100000 + Math.random() * 900000));
    try { sessionStorage.setItem('cinepro_tv_code', codigoTv); } catch (e) {}
  }

  var videoEl = document.getElementById('tvVideo');
  var painelEl = document.getElementById('painelTv');
  var listaEl = document.getElementById('listaTv');
  var catsEl = document.getElementById('barraCats');
  var osdNumEl = document.getElementById('osdNumero');
  var osdCanalEl = document.getElementById('osdCanal');
  var btnMenuEl = document.getElementById('btnAbrirMenu');
  var avisoSomEl = document.getElementById('avisoSom');
  var seloEl = document.getElementById('seloTvStatus');
  var rodapeCodEl = document.getElementById('rodapeCodControle');
  if (rodapeCodEl) rodapeCodEl.textContent = 'Controle celular (/controle): Código ' + codigoTv;

  function lerParamUrl(nome) {
    var q = window.location.search || '';
    if (!q || q.length < 2) return '';
    var pares = q.substring(1).split('&');
    for (var i = 0; i < pares.length; i++) {
      var kv = pares[i].split('=');
      if (kv[0] === nome) return decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
    }
    return '';
  }

  function httpGetJson(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { cb(null, JSON.parse(xhr.responseText)); }
          catch (e) { cb(e, null); }
        } else {
          cb(new Error('HTTP ' + xhr.status), null);
        }
      }
    };
    xhr.send();
  }

  function httpPostJson(url, obj, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (typeof cb === 'function') {
          try { cb(xhr.status >= 200 && xhr.status < 300 ? null : new Error('HTTP ' + xhr.status), JSON.parse(xhr.responseText || '{}')); }
          catch (e) { cb(e, null); }
        }
      }
    };
    xhr.send(JSON.stringify(obj || {}));
  }

  function normalizarItem(r) {
    var num = r.n !== undefined ? r.n : (r.numero || 0);
    var numStr = r.numero_str || String(num);
    while (numStr.length < 3) numStr = '0' + numStr;
    var reservas = [];
    function addRes(u) {
      if (u && typeof u === 'string' && u !== r.url && reservas.indexOf(u) === -1) {
        reservas.push(u);
      }
    }
    addRes(r.res);
    addRes(r.reserva_url);
    addRes(r.res2);
    addRes(r.reserva_url_2);
    if (r.reservas && r.reservas.length) {
      for (var i = 0; i < r.reservas.length; i++) addRes(r.reservas[i]);
    }
    return {
      id: r.id,
      numero: num,
      numero_str: numStr,
      nome: r.nome || 'Canal',
      url: r.url || '',
      reserva_url: reservas[0] || '',
      reservas: reservas,
      categoria: r.cat || r.categoria || '',
      tags: r.tags || [],
      cors: r.cors !== undefined ? Boolean(r.cors) : true
    };
  }

  function mostrarOsdCanal(ch, planoLabel) {
    var extra = planoLabel ? (' • ' + planoLabel) : '';
    document.getElementById('osdCanalNum').textContent = '#' + ch.numero_str + ' • ' + (ch.categoria || 'TV') + extra;
    document.getElementById('osdCanalNome').textContent = ch.nome;
    osdCanalEl.className = 'visivel';
    if (timerOsd) clearTimeout(timerOsd);
    timerOsd = setTimeout(function () { osdCanalEl.className = ''; }, 3500);
  }

  window.mostrarPainel = function (abrir) {
    painelAberto = !!abrir;
    painelEl.className = painelAberto ? '' : 'oculto';
    btnMenuEl.className = painelAberto ? '' : 'visivel';
  };

  window.ativarSomTv = function () {
    videoEl.muted = false;
    avisoSomEl.style.display = 'none';
    try { videoEl.play(); } catch (e) {}
  };

  function destruirHls() {
    if (hlsInst) {
      try { hlsInst.destroy(); } catch (e) {}
      hlsInst = null;
    }
    videoEl.removeAttribute('src');
  }

  function resolverUrlStreamLeve(ch, linkEscolhido) {
    if (ehLocal) return '/proxy?url=' + encodeURIComponent(linkEscolhido);
    var precisaProxy = (
      linkEscolhido.indexOf('http://') === 0 ||
      linkEscolhido.indexOf('pluto.tv') !== -1 ||
      linkEscolhido.indexOf('jmp2.uk') !== -1 ||
      !ch.cors
    );
    return precisaProxy ? (CLOUDFLARE_PROXY + encodeURIComponent(linkEscolhido)) : linkEscolhido;
  }

  function sintonizar(ch, tentativaIdx) {
    if (!ch || !ch.url) return;
    var idx = typeof tentativaIdx === 'number' ? tentativaIdx : 0;
    var listaUrls = [ch.url];
    if (ch.reservas && ch.reservas.length) {
      for (var rIdx = 0; rIdx < ch.reservas.length; rIdx++) {
        listaUrls.push(ch.reservas[rIdx]);
      }
    }
    if (idx >= listaUrls.length) return;
    if (idx === 0 && atualId !== null && atualId !== ch.id) {
      for (var k = 0; k < todos.length; k++) {
        if (todos[k].id === atualId) { anteriorIdx = k; break; }
      }
    }
    var linkEscolhido = listaUrls[idx];
    var planoLabel = idx === 0 ? '' : ('Plano ' + String.fromCharCode(65 + idx));
    atualId = ch.id;
    mostrarOsdCanal(ch, planoLabel);
    renderizarLista();

    if (!ehLocal) {
      httpPostJson('./api/controle/status', {
        tv: codigoTv,
        canal_numero: ch.numero,
        canal_nome: ch.nome,
        epg_atual: ch.categoria || 'Ao Vivo',
        epg_proximo: 'Modo TV Samsung Leve'
      });
    }

    var streamUrl = resolverUrlStreamLeve(ch, linkEscolhido);
    destruirHls();
    var ehM3u8 = linkEscolhido.toLowerCase().indexOf('.m3u8') !== -1 || streamUrl.indexOf('workers.dev') !== -1;

    function tentarReserva() {
      if (idx + 1 < listaUrls.length) {
        setTimeout(function () { sintonizar(ch, idx + 1); }, 600);
      }
    }

    videoEl.onerror = tentarReserva;

    if (videoEl.canPlayType('application/vnd.apple.mpegurl') || !ehM3u8) {
      videoEl.src = streamUrl;
      tocarVideo();
    } else if (ehM3u8 && typeof Hls !== 'undefined' && Hls.isSupported()) {
      hlsInst = new Hls({
        enableWorker: false,
        lowLatencyMode: false,
        maxBufferLength: 8,
        maxMaxBufferLength: 15,
        backBufferLength: 6,
        capLevelToPlayerSize: true,
        startLevel: 0
      });
      hlsInst.on(Hls.Events.ERROR, function (ev, data) {
        if (data && data.fatal) tentarReserva();
      });
      hlsInst.loadSource(streamUrl);
      hlsInst.attachMedia(videoEl);
      hlsInst.on(Hls.Events.MANIFEST_PARSED, function () {
        tocarVideo();
      });
    } else {
      videoEl.src = streamUrl;
      tocarVideo();
    }
  }

  function tocarVideo() {
    var p = videoEl.play();
    if (p && typeof p.then === 'function') {
      p.then(function () {
        avisoSomEl.style.display = 'none';
      }, function () {
        videoEl.muted = true;
        avisoSomEl.style.display = 'block';
        try { videoEl.play(); } catch (e) {}
      });
    }
  }

  function temTag(ch, catId) {
    if (catId === 'all') return true;
    var tags = ch.tags || [];
    for (var i = 0; i < tags.length; i++) {
      if (tags[i] === catId) return true;
    }
    return false;
  }

  function aplicarCategoria(novoIdx) {
    if (novoIdx < 0) novoIdx = CATS.length - 1;
    if (novoIdx >= CATS.length) novoIdx = 0;
    catIdx = novoIdx;
    var catId = CATS[catIdx].id;
    filtrados = [];
    for (var i = 0; i < todos.length; i++) {
      if (temTag(todos[i], catId)) filtrados.push(todos[i]);
    }
    focoIdx = 0;
    renderizarCategorias();
    renderizarLista();
  }

  function renderizarCategorias() {
    var html = '';
    for (var i = 0; i < CATS.length; i++) {
      var cls = (i === catIdx) ? 'cat-btn ativa' : 'cat-btn';
      html += '<button type="button" class="' + cls + '" data-cidx="' + i + '">' + CATS[i].nome + '</button>';
    }
    catsEl.innerHTML = html;
    var btns = catsEl.getElementsByTagName('button');
    for (var j = 0; j < btns.length; j++) {
      btns[j].onclick = function () {
        aplicarCategoria(parseInt(this.getAttribute('data-cidx'), 10));
      };
    }
  }

  function renderizarLista() {
    if (filtrados.length === 0) {
      listaEl.innerHTML = '<div style="padding:20px;color:#999;">Nenhum canal nesta categoria.</div>';
      return;
    }
    if (focoIdx < 0) focoIdx = 0;
    if (focoIdx >= filtrados.length) focoIdx = filtrados.length - 1;

    var ini = focoIdx - 6;
    if (ini < 0) ini = 0;
    var fim = ini + 14;
    if (fim > filtrados.length) {
      fim = filtrados.length;
      ini = fim - 14;
      if (ini < 0) ini = 0;
    }

    var html = '';
    for (var i = ini; i < fim; i++) {
      var ch = filtrados[i];
      var cls = 'item-tv';
      if (i === focoIdx) cls += ' foco';
      if (ch.id === atualId) cls += ' ativo';
      var vipTag = temTag(ch, 'vip') ? '<span class="tag-vip">VIP</span>' : '';
      html += '<div class="' + cls + '" data-idx="' + i + '">' +
        '<span class="num-tv">#' + ch.numero_str + '</span>' +
        '<span class="nome-tv">' + ch.nome + '</span>' + vipTag +
        '</div>';
    }
    listaEl.innerHTML = html;
    var itens = listaEl.getElementsByTagName('div');
    for (var k = 0; k < itens.length; k++) {
      itens[k].onclick = function () {
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        focoIdx = idx;
        sintonizar(filtrados[idx]);
        setTimeout(function () { window.mostrarPainel(false); }, 1500);
      };
    }
  }

  function moverFoco(delta) {
    if (!filtrados.length) return;
    focoIdx = (focoIdx + delta + filtrados.length) % filtrados.length;
    if (!painelAberto) {
      sintonizar(filtrados[focoIdx]);
    } else {
      renderizarLista();
    }
  }

  function processarDigito(d) {
    bufferDigitos += d;
    if (bufferDigitos.length > 4) bufferDigitos = d;
    osdNumEl.textContent = 'CH ' + bufferDigitos;
    osdNumEl.style.display = 'block';
    if (timerDigitos) clearTimeout(timerDigitos);
    timerDigitos = setTimeout(function () {
      var alvo = parseInt(bufferDigitos, 10);
      bufferDigitos = '';
      osdNumEl.style.display = 'none';
      sintonizarPorNumero(alvo);
    }, 1200);
  }

  function sintonizarPorNumero(alvo) {
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].numero === alvo) {
        if (catIdx !== 0) aplicarCategoria(0);
        for (var j = 0; j < filtrados.length; j++) {
          if (filtrados[j].id === todos[i].id) { focoIdx = j; break; }
        }
        sintonizar(todos[i]);
        return;
      }
    }
  }

  function carregarVipComChave(chaveVip) {
    if (!chaveVip) return;
    httpGetJson('./api/canais_vip?chave=' + encodeURIComponent(chaveVip), function (errVip, vip) {
      if (!errVip && vip && vip.ok && vip.canais && vip.canais.length) {
        var mapaIds = {};
        for (var i = 0; i < todos.length; i++) mapaIds[todos[i].id] = true;
        for (var j = 0; j < vip.canais.length; j++) {
          var item = normalizarItem(vip.canais[j]);
          if (!mapaIds[item.id]) {
            todos.push(item);
            mapaIds[item.id] = true;
          }
        }
        try { localStorage.setItem('cinepro_vip_key', chaveVip); } catch (e) {}
        seloEl.textContent = '👑 ' + todos.length + ' Canais';
        aplicarCategoria(catIdx);
      }
    });
  }

  function executarComandoControle(cmd, val) {
    if (cmd === 'proximo') moverFoco(1);
    else if (cmd === 'anterior') moverFoco(-1);
    else if (cmd === 'playpause') {
      if (videoEl.paused) { try { videoEl.play(); } catch (e) {} }
      else { try { videoEl.pause(); } catch (e) {} }
    } else if (cmd === 'mute') {
      videoEl.muted = !videoEl.muted;
      if (!videoEl.muted) avisoSomEl.style.display = 'none';
    } else if (cmd === 'volume_up') {
      videoEl.volume = Math.min(1, videoEl.volume + 0.1);
    } else if (cmd === 'volume_down') {
      videoEl.volume = Math.max(0, videoEl.volume - 0.1);
    } else if (cmd === 'fullscreen' || cmd === 'cinema') {
      window.mostrarPainel(!painelAberto);
    } else if (cmd === 'voltar') {
      if (anteriorIdx >= 0 && todos[anteriorIdx]) sintonizar(todos[anteriorIdx]);
    } else if (cmd === 'sintonizar') {
      sintonizarPorNumero(parseInt(val, 10));
    } else if (cmd === 'recarregar') {
      window.location.reload();
    } else if (cmd === 'categoria') {
      for (var c = 0; c < CATS.length; c++) {
        if (CATS[c].id === val) { aplicarCategoria(c); break; }
      }
    } else if (cmd === 'voz') {
      var q = String(val || '').toLowerCase();
      for (var m = 0; m < todos.length; m++) {
        if (todos[m].nome.toLowerCase().indexOf(q) !== -1) {
          sintonizar(todos[m]);
          break;
        }
      }
    } else if (cmd === 'login_vip') {
      var partes = String(val || '').split('|');
      var uV = (partes[0] || '').replace(/\s+/g, '').toLowerCase();
      var sV = (partes[1] || '').replace(/\s+/g, '');
      if (uV && sV) {
        httpPostJson('./api/cinepro/login', { usuario: uV, senha: sV }, function (err, d) {
          if (!err && d && d.ok) carregarVipComChave(d.usuario);
        });
      } else if (uV) {
        carregarVipComChave(uV);
      }
    }
  }

  function iniciarControleNuvem() {
    if (ehLocal) return;
    setInterval(function () {
      httpGetJson('./api/controle/ouvir?tv=' + encodeURIComponent(codigoTv), function (err, d) {
        if (err || !d || !d.comandos) return;
        for (var i = 0; i < d.comandos.length; i++) {
          executarComandoControle(d.comandos[i].cmd, d.comandos[i].val);
        }
      });
    }, 1800);
  }

  document.addEventListener('keydown', function (e) {
    var code = e.keyCode || e.which;
    if (code >= 48 && code <= 57) {
      processarDigito(String(code - 48));
      return;
    }
    if (code >= 96 && code <= 105) {
      processarDigito(String(code - 96));
      return;
    }
    if (code === 38) { e.preventDefault(); moverFoco(-1); }
    else if (code === 40) { e.preventDefault(); moverFoco(1); }
    else if (code === 427 || code === 33) {
      e.preventDefault();
      if (filtrados.length) {
        focoIdx = (focoIdx - 1 + filtrados.length) % filtrados.length;
        sintonizar(filtrados[focoIdx]);
      }
    }
    else if (code === 428 || code === 34) {
      e.preventDefault();
      if (filtrados.length) {
        focoIdx = (focoIdx + 1) % filtrados.length;
        sintonizar(filtrados[focoIdx]);
      }
    }
    else if (code === 37 && painelAberto) { e.preventDefault(); aplicarCategoria(catIdx - 1); }
    else if (code === 39 && painelAberto) { e.preventDefault(); aplicarCategoria(catIdx + 1); }
    else if (code === 13) {
      e.preventDefault();
      if (avisoSomEl.style.display === 'block') { window.ativarSomTv(); return; }
      if (!painelAberto) { window.mostrarPainel(true); return; }
      var ch = filtrados[focoIdx];
      if (ch && ch.id !== atualId) sintonizar(ch);
      else window.mostrarPainel(false);
    }
    else if (code === 8 || code === 27 || code === 461 || code === 10009) {
      e.preventDefault();
      window.mostrarPainel(!painelAberto);
    }
  });

  function iniciarTv() {
    var uParam = lerParamUrl('u');
    var sParam = lerParamUrl('s');
    var vipParam = lerParamUrl('vip');
    var chaveSalva = vipParam;
    if (!chaveSalva) {
      try { chaveSalva = (localStorage.getItem('cinepro_vip_key') || ''); } catch (e) {}
    }

    httpGetJson('./canais.json', function (err, base) {
      if (err || !base || !base.length) return;
      for (var i = 0; i < base.length; i++) todos.push(normalizarItem(base[i]));
      seloEl.textContent = '📺 ' + todos.length + ' Abertos';
      aplicarCategoria(0);
      sintonizar(filtrados[0]);
      iniciarControleNuvem();

      if (uParam && sParam) {
        httpPostJson('./api/cinepro/login', { usuario: uParam.toLowerCase(), senha: sParam }, function (errL, resL) {
          if (!errL && resL && resL.ok) carregarVipComChave(resL.usuario);
        });
      } else if (chaveSalva) {
        carregarVipComChave(chaveSalva);
      }
    });
  }

  iniciarTv();
})();
</script>
